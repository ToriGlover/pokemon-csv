name: Build Pokemon Master CSV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@://github.com{GITHUB_REPOSITORY}.git" .
      - name: Run script
        run: python3 build_csv.py
      - name: Save CSV to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pokemon_all_cards_master.csv
          git commit -m "Generate master Pokemon CSV"
          git push
